<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wopzan | The Jewel of Anantnag</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fefaf0;
            color: #1e2a2f;
            overflow-x: hidden;
        }

        /* Smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Custom color palette - professional, vibrant, elegant */
        :root {
            --primary: #0f5c3f;
            --primary-light: #2a9d6e;
            --secondary: #f4a261;
            --accent: #e76f51;
            --gold: #e9c46a;
            --cream: #fffcf2;
            --dark: #2d3e2b;
            --glass-bg: rgba(255, 252, 240, 0.85);
            --shadow-sm: 0 10px 30px -12px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
        }

        /* Animated gradient background for hero */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .hero {
            background: linear-gradient(125deg, #0a4c33, #1c754d, #f4a261, #e9c46a);
            background-size: 300% 300%;
            animation: gradientShift 12s ease infinite;
            border-radius: 0 0 3rem 3rem;
            padding: 3rem 1rem 5rem 1rem;
            color: white;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="%23fefaf0" opacity="0.8"></path></svg>') repeat-x;
            bottom: 0;
            height: 60px;
            width: 100%;
            background-size: 1200px 60px;
        }

        /* Glassmorphic cards */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 245, 215, 0.7);
            box-shadow: var(--shadow-sm);
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .glass-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: #f4a26180;
        }

        /* Section title with animated underline */
        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(125deg, #0f5c3f, #e76f51);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #f4a261, #e9c46a);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .section-title:hover::after {
            width: 100%;
        }

        /* Stat cards with entrance animation */
        .stat-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem 0.8rem;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--secondary);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.15);
        }

        .stat-card i {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #0f5c3f, #f4a261);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Facility badges */
        .facility-badge {
            background: linear-gradient(115deg, #fff5e6, #ffffff);
            border-radius: 60px;
            padding: 0.7rem 1.4rem;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            font-weight: 600;
            color: #2d6a4f;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: all 0.2s;
            border: 1px solid #fae6c3;
        }

        .facility-badge:hover {
            transform: scale(1.02);
            background: white;
            border-color: var(--secondary);
        }

        /* Emergency Grid */
        .emergency-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.2rem;
        }

        .emergency-item {
            background: linear-gradient(145deg, #fff2e6, #ffe9db);
            border-radius: 1.2rem;
            padding: 1.2rem;
            text-align: center;
            font-weight: 700;
            transition: all 0.2s;
            border-left: 5px solid var(--secondary);
        }

        .emergency-item:hover {
            transform: translateY(-3px);
            background: #fff7ef;
        }

        /* Gallery grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .gallery-card {
            background: white;
            border-radius: 1.4rem;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
            position: relative;
        }

        .gallery-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.05);
        }

        .gallery-card:hover {
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.2);
        }

        /* Announcements */
        .announcement-item {
            background: white;
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            border-left: 5px solid var(--secondary);
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .announcement-item:hover {
            transform: translateX(5px);
            background: #fffcf5;
        }

        /* Buttons */
        .btn-grad {
            background: linear-gradient(95deg, #0f5c3f, #2a9d6e);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            transition: 0.25s;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(15,92,63,0.3);
        }

        .btn-grad:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 22px rgba(15,92,63,0.4);
        }

        /* Instagram Modal */
        .modal-pop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-pop.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: #fffef7;
            max-width: 400px;
            width: 90%;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 40px 60px rgba(0,0,0,0.3);
            animation: fadeUp 0.3s ease;
        }
        @keyframes fadeUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Footer */
        footer {
            background: #0e3824;
            color: #e2f0e6;
            padding: 2rem;
            border-radius: 2rem 2rem 0 0;
            margin-top: 3rem;
        }

        /* Scroll animations using AOS overrides */
        [data-aos] {
            transition-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .section-title { font-size: 1.7rem; }
            .hero h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
